# Push a tag like v0.1.0 to build the setup and portable exes and publish them
# as a release. The tag has to match the version in Cargo.toml, which is what
# the installer writes into Installed apps.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Pinned to commits: a moved tag cannot change what runs with write
      # access. No build cache either, so nothing from another run can end up
      # in the published exe.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Check the tag against Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match version $version in Cargo.toml" }
      - run: cargo test --locked
      - run: pwsh -File scripts/package.ps1
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/ChronoDesk-Setup.exe
            dist/ChronoDesk.exe
            dist/SHA256SUMS.txt

# Push a tag like v0.1.0 to build ChronoDesk-Setup.exe and publish it as a release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: pwsh -File scripts/package.ps1
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ChronoDesk-Setup.exe
            dist/ChronoDesk-Setup.exe.sha256

[package]
name = "chronodesk"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
description = "Transparent always-on-top desktop clock, stopwatch, timer and world market board"
license = "MIT"

[features]
# Test-only: loopback command channel and frame telemetry. Never in a release build.
instrument = []

[dependencies]
# glow instead of wgpu: much smaller binary and far lower RAM for a tiny overlay.
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tray-icon = "0.25.1"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# Same version/features eframe already builds; used to hide the Win11 DWM border
# and to enumerate the attached monitors.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
# For the per-monitor work area (the screen minus the taskbar), which winit does
# not expose, the single-instance mutex, the per-user `Run` key and the daily
# update check, which uses the HTTP stack Windows already has. Pinned to the
# version winit already builds, so no extra crate is compiled and `HMONITOR` is
# the same type on both sides.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
